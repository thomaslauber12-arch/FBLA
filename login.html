<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | SEHS FBLA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div class="card" style="max-width: 400px; width: 100%; padding: 2rem; margin: 1rem;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <span class="brand-badge" style="font-size: 1rem;">SEHS FBLA</span>
      <h2 style="color: var(--primary); margin-top: 0.5rem;">Advisor / Admin Portal</h2>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" class="form-control" placeholder="Username" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="Password" required>
      </div>

      <div id="login-error" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 1rem; display: none;">
        Invalid credentials provided. Default: admin / fbla2026!
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
    </form>
  </div>

  <script src="js/data.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const u = document.getElementById("username").value;
      const p = document.getElementById("password").value;

      if (db.login(u, p)) {
        window.location.href = "admin.html";
      } else {
        document.getElementById("login-error").style.display = "block";
      }
    });
  </script>
</body>
</html>
