<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login | SEBHS FBLA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">

  <header class="header">
    <div class="nav-container">
      <a href="index.html" class="brand-branding">
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/d/d8/Future_Business_Leaders_of_America_logo.svg/1200px-Future_Business_Leaders_of_America_logo.svg.png" alt="FBLA Logo" class="nav-logo">
        <span class="brand"><span class="brand-badge">SEBHS</span> FBLA</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="announcements.html">Announcements</a></li>
        <li><a href="officers.html">Officers</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html" class="admin-link active">Portal</a></li>
      </ul>
    </div>
  </header>

  <main class="container" style="display: flex; justify-content: center; align-items: center; padding: 4rem 1.5rem;">
    <div class="card" style="max-width: 420px; width: 100%; border-top: 4px solid var(--gold); box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 1.75rem;">
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/d/d8/Future_Business_Leaders_of_America_logo.svg/1200px-Future_Business_Leaders_of_America_logo.svg.png" alt="FBLA Logo" height="52" style="margin-bottom: 0.75rem;">
        <h2 style="font-size: 1.5rem; font-weight: 800;">Executive Portal</h2>
        <p style="color: var(--text-muted); font-size: 0.875rem;">Sign in to access admin capabilities</p>
      </div>

      <div id="login-alert" style="display: none; padding: 0.75rem; border-radius: var(--radius-sm); background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; font-size: 0.85rem; margin-bottom: 1rem; text-align: center;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" required placeholder="admin">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Authenticate</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem;">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/d/d8/Future_Business_Leaders_of_America_logo.svg/1200px-Future_Business_Leaders_of_America_logo.svg.png" alt="FBLA Logo" height="36">
        <span style="font-weight: 700; color: #ffffff;">Southeast Bulloch High School FBLA</span>
      </div>
      <div>&copy; 2026 SEBHS FBLA. All rights reserved.</div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
