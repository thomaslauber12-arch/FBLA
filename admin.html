<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Dashboard | SEBHS FBLA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="nav-container">
      <div class="brand"><span class="brand-badge">ADMIN</span> SEBHS FBLA Dashboard</div>
      <button class="btn btn-secondary btn-sm" onclick="logoutAdmin()">Logout</button>
    </div>
  </header>

  <main class="container">
    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="events">Events</button>
      <button class="tab-btn" data-tab="announcements">Announcements</button>
      <button class="tab-btn" data-tab="officers">Officers</button>
      <button class="tab-btn" data-tab="inquiries">Inquiries</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </div>

    <!-- Events Tab -->
    <div id="events-tab" class="tab-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3>Manage Events</h3>
        <button class="btn btn-primary btn-sm" id="btn-add-event">+ Add Event</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr><th>Title</th><th>Date</th><th>Location</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="admin-events-list"></tbody>
        </table>
      </div>
    </div>

    <!-- Announcements Tab -->
    <div id="announcements-tab" class="tab-content" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3>Manage Announcements</h3>
        <button class="btn btn-primary btn-sm" id="btn-add-announcement">+ Create Announcement</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr><th>Title</th><th>Date Posted</th><th>Pinned</th><th>Actions</th></tr>
          </thead>
          <tbody id="admin-announcements-list"></tbody>
        </table>
      </div>
    </div>

    <!-- Officers Tab -->
    <div id="officers-tab" class="tab-content" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3>Manage Officers</h3>
        <button class="btn btn-primary btn-sm" id="btn-add-officer">+ Add Officer</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr><th>Name</th><th>Position</th><th>Actions</th></tr>
          </thead>
          <tbody id="admin-officers-list"></tbody>
        </table>
      </div>
    </div>

    <!-- Inquiries Tab -->
    <div id="inquiries-tab" class="tab-content" style="display: none;">
      <div style="margin-bottom: 1rem;">
        <h3>Received Inquiries</h3>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr><th>Date</th><th>Name</th><th>Email</th><th>Message</th><th>Actions</th></tr>
          </thead>
          <tbody id="admin-inquiries-list"></tbody>
        </table>
      </div>
    </div>

    <!-- Settings Tab -->
    <div id="settings-tab" class="tab-content" style="display: none;">
      <h3>Chapter Settings</h3>
      <form id="settings-form" style="max-width: 500px; margin-top: 1rem;">
        <div class="form-group"><label>Contact Email</label><input type="email" id="set-email" class="form-control"></div>
        <div class="form-group"><label>Phone Number</label><input type="text" id="set-phone" class="form-control"></div>
        <div class="form-group"><label>School Address</label><input type="text" id="set-address" class="form-control"></div>
        <button type="submit" class="btn btn-primary">Save Settings</button>
      </form>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal" id="admin-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
